spring.application.name=demo-ticktick-mock

# Allows Spring Boot to connect to cloud PostgreSQL if ENV variables exist, otherwise falls back to H2
# Cloud Database auto-configuration (Render supplies JDBC_DATABASE_URL)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/taskdb;DB_CLOSE_ON_EXIT=FALSE}spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:org.h2.Driver}

# Automatically updates the database tables when fields are added
# Retain existing database tables on restart instead of dropping them
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Enable H2 web console (optional, accessible at /h2-console)
spring.h2.console.enabled=true