<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>

    <!-- PWA Setup -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tasks">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="app-container">
    <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>My Tasks</h2>
        <button type="button" class="btn-secondary" onclick="openScheduleModal()">⚙️ Schedule Day</button>
    </div>

    <!-- Task Creation Form with Slice Selection -->
    <form class="task-form" onsubmit="addTask(event)">
        <input type="text" id="taskTitle" placeholder="What needs to be done?" required>

        <select id="taskSlice">
            <option value="">No Slice (Unassigned)</option>
            <!-- Generated time slices injected dynamically -->
        </select>

        <select id="taskPriority">
            <option value="1">Low Priority</option>
            <option value="2">Medium Priority</option>
            <option value="3" selected>High Priority</option>
        </select>

        <button type="submit">Add Task</button>
    </form>

    <!-- Dynamic Day Slices & Tasks Container -->
    <div id="scheduleSlicesContainer">
        <!-- Generated time slices & unassigned tasks will be rendered here -->
    </div>

    <!-- Fallback Task List for Unassigned Tasks -->
    <ul class="task-list" id="taskList"></ul>

    <!-- Completed Section -->
    <div id="completedSection" class="hidden">
        <h3 class="completed-header">Completed</h3>
        <ul class="task-list" id="completedTaskList">
            <!-- Completed Tasks injected here -->
        </ul>
    </div>
</div>

<!-- Custom Edit Modal -->
<div id="editModal" class="modal-overlay hidden">
    <div class="modal-content sticky-note">
        <div class="modal-header">
            <h3>Edit Task</h3>
            <button type="button" onclick="closeEditModal()" class="icon-btn">✖</button>
        </div>

        <div class="modal-body">
            <input type="text" id="editTaskInput" placeholder="Task Title" class="input-field">

            <div class="form-group" style="margin: 10px 0;">
                <label>Assigned Slice:</label>
                <select id="editTaskSlice" class="input-field">
                    <option value="">No Slice (Unassigned)</option>
                </select>
            </div>

            <div class="md-toolbar">
                <button type="button" onclick="insertMarkdown('[ ] ')">☑ Task</button>
                <button type="button" onclick="insertMarkdown('- ')">• List</button>
                <button type="button" onclick="insertMarkdown('1. ')">1. Number</button>
                <button type="button" onclick="insertMarkdown('### ')">H3</button>
                <button type="button" onclick="insertMarkdown('**bold**')">Bold</button>
            </div>

            <textarea id="editTaskDescription" oninput="updatePreview()" placeholder="Add notes (Markdown supported)..."></textarea>

            <div id="editTaskPreview" class="markdown-preview"></div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
            <button type="button" class="btn-primary" onclick="submitEdit()">Save</button>
        </div>
    </div>
</div>

<!-- Day Setup / Schedule Modal -->
<div id="scheduleModal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Configure Today's Schedule</h2>
            <button type="button" onclick="closeScheduleModal()" class="icon-btn">✖</button>
        </div>

        <div class="form-group">
            <label>Wake Up Time / Start of Day:</label>
            <input type="time" id="startTime" value="08:00">
        </div>

        <div class="form-group">
            <label>Bedtime / End of Day:</label>
            <input type="time" id="endTime" value="22:00">
        </div>

        <hr class="divider">

        <h3>Blocked Time Windows (Class, Work, etc.)</h3>
        <div id="blockedWindowsContainer">
            <div class="blocked-row">
                <input type="text" placeholder="Activity (e.g. Class)" class="block-label" value="Class">
                <input type="time" class="block-start" value="10:00">
                <span>to</span>
                <input type="time" class="block-end" value="13:00">
            </div>
            <div class="blocked-row">
                <input type="text" placeholder="Activity (e.g. Work)" class="block-label" value="Work">
                <input type="time" class="block-start" value="14:30">
                <span>to</span>
                <input type="time" class="block-end" value="18:00">
            </div>
        </div>

        <button type="button" id="addBlockBtn" class="btn-secondary">+ Add Blocked Window</button>

        <div class="modal-actions">
            <button type="button" id="generateSlicesBtn" class="btn-primary">Generate Slices</button>
        </div>
    </div>
</div>

<!-- Custom Delete Modal -->
<div id="deleteModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Delete Task?</h3>
            <button type="button" onclick="closeDeleteModal()" class="icon-btn">✖</button>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete this task? This cannot be undone.</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            <button type="button" class="btn-delete" onclick="submitDelete()">Delete</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
